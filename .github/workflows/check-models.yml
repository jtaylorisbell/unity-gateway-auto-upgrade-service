# Daily: look for newer servable system.ai models and open (or update) one PR that bumps them.
name: Check for new models

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write # push the bot/model-upgrades branch
  pull-requests: write

concurrency:
  group: check-models

jobs:
  check:
    runs-on: ubuntu-latest
    environment: staging
    env:
      # Secrets, not variables, so the values are masked in run logs, which are public on a public repo.
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_AUTH_TYPE: oauth-m2m
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: databricks/setup-cli@main

      - name: Find newer servable models
        id: check
        # Probes go in the staging schema.
        run: uv run check-models -t staging --summary-file "$RUNNER_TEMP/pr-body.md"

      # Reuses one branch, so an unmerged PR gets updated instead of a new one opening every day.
      # Reviewers come from .github/CODEOWNERS. Because the PR is opened with the default GITHUB_TOKEN, its deploy.yml
      # checks wait for someone with write access to click "Approve workflows to run" on the PR.
      - name: Open or update the PR
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/model-upgrades
          delete-branch: true
          add-paths: resources/model_services.yml
          commit-message: Upgrade Unity Gateway model services to newer system.ai models
          title: Upgrade Unity Gateway model services
          body-path: ${{ runner.temp }}/pr-body.md
          labels: model-upgrade
