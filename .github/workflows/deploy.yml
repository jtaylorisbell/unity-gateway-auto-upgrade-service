# Pull requests deploy to staging and smoke test every model service. Merges to main do the same against prod.
name: Deploy model services

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest

  deploy:
    needs: test
    # Pull requests from forks get no secrets, so they only run the tests.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'prod' || 'staging' }}
    # One deploy per target at a time; PRs queue for staging and the last one deployed wins.
    concurrency:
      group: deploy-${{ github.event_name == 'push' && 'prod' || 'staging' }}
    env:
      TARGET: ${{ github.event_name == 'push' && 'prod' || 'staging' }}
      # Secrets, not variables, so the values are masked in run logs, which are public on a public repo.
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_AUTH_TYPE: oauth-m2m
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: databricks/setup-cli@main
      # No --auto-approve: a deploy that would delete a model service should stop, not proceed.
      - run: databricks bundle deploy -t "$TARGET"
      - run: |
          databricks bundle summary -t "$TARGET" -o json > "$RUNNER_TEMP/summary.json"
          uv run smoke-test "$RUNNER_TEMP/summary.json"
