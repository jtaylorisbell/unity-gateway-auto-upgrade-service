# Unity Gateway model services, one per model class, each pinned to a system.ai model.
# The check-models GitHub workflow opens a PR when a newer servable version is available; merging deploys it.
#
# The workspace isn't in this repo. It comes from DATABRICKS_CONFIG_PROFILE in .env locally (see .env.example) and
# from the GitHub environment's DATABRICKS_HOST secret in CI.
bundle:
  name: unity_gateway_auto_upgrade

include:
  - resources/*.yml

variables:
  catalog:
    description: Catalog that holds the model services.
  schema:
    description: Schema that holds the model services. Must already exist.
  grants:
    description: >-
      Grants on every model service, e.g. EXECUTE for the groups that should call them. This is the complete
      list: grants made outside the bundle are removed on the next deploy. Use account-level principals;
      workspace-local groups can't be used in Unity Catalog grants.
    type: complex
  prevent_destroy:
    description: Refuse deploys that would delete a model service (and break its callers).
    default: true

targets:
  # Personal sandbox. Model service names aren't prefixed in development mode, so if someone else already deploys
  # here, set BUNDLE_VAR_schema in your .env to a schema of your own.
  dev:
    mode: development
    default: true
    variables:
      catalog: taylor
      schema: managed_model_services_dev
      prevent_destroy: false
      grants:
        - principal: ${workspace.current_user.userName}
          privileges: [EXECUTE]

  # Pull requests deploy here and get smoke tested; check-models also creates its throwaway probes here.
  staging:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: taylor
      schema: managed_model_services_staging
      # The CI service principal deploys, owns the services, and doesn't need a grant of its own.
      grants:
        - principal: account users
          privileges: [EXECUTE]

  # Merges to main deploy here.
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: taylor
      schema: managed_model_services_prod
      # The CI service principal deploys, owns the services, and doesn't need a grant of its own.
      grants:
        - principal: account users
          privileges: [EXECUTE]
