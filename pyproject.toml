[project]
name = "model_upgrades"
version = "0.1.0"
description = "Proposes upgrades to the system.ai models behind bundle-managed Unity Gateway model services."
requires-python = ">=3.12,<3.13"
dependencies = [
    "databricks-sdk>=0.156.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
check-models = "model_upgrades.check:main"
smoke-test = "model_upgrades.smoke_test:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
